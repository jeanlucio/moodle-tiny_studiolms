name: Moodle Plugin CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      skip: ${{ steps.set-matrix.outputs.skip }}
    steps:
      - id: set-matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Branch push on a tagged commit: defer to the tag CI run.
          if [[ "${{ github.event_name }}" == "push" && \
                "${{ github.ref }}" != refs/tags/* ]]; then
            TAGGED=$(gh api "repos/${{ github.repository }}/git/refs/tags" \
              --jq --arg sha "${{ github.sha }}" \
              '.[] | select(.object.sha == $sha) | .ref' 2>/dev/null | head -1)
            if [[ -n "${TAGGED}" ]]; then
              echo "Commit is tagged (${TAGGED}) — skipping branch push run."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]] || \
             [[ "${{ github.event_name }}" == "pull_request" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'matrix<<EOF' >> $GITHUB_OUTPUT
            echo '[
              {"moodle-branch":"MOODLE_502_STABLE","php":"8.3","database":"pgsql","runchecks":"all"},
              {"moodle-branch":"MOODLE_502_STABLE","php":"8.4","database":"mariadb"},
              {"moodle-branch":"MOODLE_501_STABLE","php":"8.3","database":"pgsql"},
              {"moodle-branch":"MOODLE_501_STABLE","php":"8.2","database":"mariadb"},
              {"moodle-branch":"MOODLE_500_STABLE","php":"8.2","database":"pgsql"},
              {"moodle-branch":"MOODLE_500_STABLE","php":"8.2","database":"mariadb"},
              {"moodle-branch":"MOODLE_405_STABLE","php":"8.2","database":"pgsql"},
              {"moodle-branch":"MOODLE_405_STABLE","php":"8.2","database":"mariadb"}
            ]' >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          else
            echo 'matrix<<EOF' >> $GITHUB_OUTPUT
            echo '[
              {"moodle-branch":"MOODLE_502_STABLE","php":"8.3","database":"pgsql","runchecks":"all"},
              {"moodle-branch":"MOODLE_405_STABLE","php":"8.2","database":"mariadb"}
            ]' >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          fi

  test:
    needs: setup
    if: needs.setup.outputs.skip != 'true'
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, gd, xml, dom, json, zip, bcmath, intl, soap, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci savepoints

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache Lint
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci mustache

      - name: Grunt tasks
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat tests
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
